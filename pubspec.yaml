name: mobilni_face_app
description: "A fun face filter app with live face detection and AR filters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Face detection (Google ML Kit)
  google_mlkit_face_detection: ^0.11.0

  # Camera & image picking
  camera: ^0.10.5+9
  image_picker: ^1.1.2

  # State management
  provider: ^6.1.2

  # Filter carousel UI
  carousel_slider: ^4.2.1

  # File system
  path_provider: ^2.1.3

  # Permissions
  permission_handler: ^11.3.1

  # Save & Share
  share_plus: ^9.0.0
  gal: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
